# PINK TROMBONE: the module of pinktrombone_module.c. The voice is single-precision float: the FPU as MONK-1 and
# the other float modules build themselves (the floats live in the general registers: nothing more to save in the
# audio interrupt).
name = PINK TROMBONE
version = 1
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -O2
includes = ..
sources = ../pinktrombone_module.c
